<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodePet · 猫猫</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: no-drag;
      user-select: none;
      cursor: grab;
      pointer-events: auto;
    }

    body.dragging {
      cursor: grabbing;
    }

    .container {
      width: 100vw;
      height: 100vh;
      position: relative;
      pointer-events: auto;
    }

    .mascot {
      position: absolute;
      left: 50%;
      top: 50%;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.35));
      transition: opacity 0.3s ease;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transform-origin: center center;
      pointer-events: auto;
    }

    .mascot.idle {
      opacity: 0.88;
    }

    .mascot.run-bounce {
      animation: codepet-bounce 0.5s ease-in-out infinite alternate;
    }

    @keyframes codepet-bounce {
      from { transform: translate(-50%, -50%) translateY(0); }
      to   { transform: translate(-50%, -50%) translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="mascot" id="mascot" alt="CodePet 猫猫" draggable="false">
  </div>

  <script>
    const mascot = document.getElementById('mascot');
    const urlParams = new URLSearchParams(window.location.search);
    const mascotId = urlParams.get('mascot') || 'cat';

    const MASCOT_CONFIGS = {
      cat: {
        runningSrc: 'assets/running_cat.webp',
        idleSrc: 'assets/mitarashi.webp',
        width: 120,
        height: 84,
        alt: 'CodePet 猫猫'
      },
      penguin: {
        runningSrc: 'assets/penguin_running.webp',
        idleSrc: 'assets/penguin_idle.png',
        width: 84,
        height: 84,
        alt: 'CodePet 企鹅'
      }
    };
    const mascotConfig = MASCOT_CONFIGS[mascotId] || MASCOT_CONFIGS.cat;

    let mode = 'idle';
    let dragging = false;
    let dragStartScreenX = 0;
    let dragStartScreenY = 0;
    let winStartX = 0;
    let winStartY = 0;
    let winStartReady = false;

    function updateImage() {
      const isRunning = mode === 'running';
      mascot.src = isRunning ? mascotConfig.runningSrc : mascotConfig.idleSrc;
      mascot.alt = mascotConfig.alt;
      mascot.style.width = `${mascotConfig.width}px`;
      mascot.style.height = `${mascotConfig.height}px`;
      mascot.classList.toggle('idle', !isRunning);
      mascot.classList.toggle('run-bounce', isRunning && !dragging);
      // 非拖动时定位：以窗口中心为锚点
      if (!dragging) {
        mascot.style.transform = 'translate(-50%, -50%)';
      }
    }

    window.electronAPI.onSetMode((newMode) => {
      mode = newMode === 'running' ? 'running' : 'idle';
      updateImage();
    });

    window.electronAPI.onSetSpeed(() => { /* 保留接口：速度由原地动画代替 */ });

    // ---- 拖动：把猫猫拎到任意位置（屏幕绝对坐标，避免窗口内偏移误差） ----
    const container = document.querySelector('.container');

    container.addEventListener('mousedown', async (e) => {
      if (e.button !== 0) return; // 仅左键拖动
      const pos = await window.electronAPI.getWindowPosition().catch(() => ({ x: 0, y: 0 }));
      winStartX = pos.x;
      winStartY = pos.y;
      winStartReady = true;
      dragStartScreenX = e.screenX;
      dragStartScreenY = e.screenY;
      dragging = true;
      document.body.classList.add('dragging');
      mascot.classList.remove('run-bounce');
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging || !winStartReady) return;
      const dx = e.screenX - dragStartScreenX;
      const dy = e.screenY - dragStartScreenY;
      window.electronAPI.setWindowPosition(winStartX + dx, winStartY + dy);
    });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      winStartReady = false;
      document.body.classList.remove('dragging');
      mascot.classList.toggle('run-bounce', mode === 'running');
    });

    // ---- 右键：弹出迷你菜单（与设置面板同风格） ----
    container.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const x = window.screenX + e.clientX;
      const y = window.screenY + e.clientY;
      window.electronAPI.showContextMenu(x, y);
    });

    updateImage();
  </script>
</body>
</html>
