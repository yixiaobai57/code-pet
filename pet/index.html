<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodePet · 奶蛙</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      /* 拖动由主进程轮询光标实现（pet:drag-start/pet:drag-end），
         窗口本体不使用 app-region drag，保证右键菜单事件不被吞。 */
      -webkit-app-region: no-drag;
      user-select: none;
      cursor: grab;
      pointer-events: auto;
    }

    .container {
      width: 100vw;
      height: 100vh;
      position: relative;
      pointer-events: auto;
      -webkit-app-region: no-drag;
    }

    .mascot {
      position: absolute;
      left: 50%;
      top: 50%;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.35));
      transition: opacity 0.3s ease;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transform-origin: center center;
      pointer-events: auto;
      -webkit-app-region: no-drag;
    }

    .mascot.idle {
      opacity: 0.88;
    }

    .mascot.run-bounce {
      animation: codepet-bounce 0.5s ease-in-out infinite alternate;
    }

    @keyframes codepet-bounce {
      from { transform: translate(-50%, -50%) translateY(0); }
      to   { transform: translate(-50%, -50%) translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="mascot" id="mascot" alt="CodePet 奶蛙" draggable="false">
  </div>

  <script>
    const mascot = document.getElementById('mascot');
    const urlParams = new URLSearchParams(window.location.search);
    const mascotId = urlParams.get('mascot') || 'frog';

    const MASCOT_CONFIGS = {
      frog: {
        runningSrc: 'assets/frog_running.webp',
        idleSrc: 'assets/frog_idle.webp',
        width: 120,
        height: 120,
        alt: 'CodePet 奶蛙'
      },
      cat: {
        runningSrc: 'assets/running_cat.webp',
        idleSrc: 'assets/mitarashi.webp',
        width: 120,
        height: 84,
        alt: 'CodePet 猫猫'
      }
    };
    const mascotConfig = MASCOT_CONFIGS[mascotId] || MASCOT_CONFIGS.frog;

    let mode = 'idle';

    function updateImage() {
      const isRunning = mode === 'running';
      mascot.src = isRunning ? mascotConfig.runningSrc : mascotConfig.idleSrc;
      mascot.alt = mascotConfig.alt;
      mascot.style.width = `${mascotConfig.width}px`;
      mascot.style.height = `${mascotConfig.height}px`;
      mascot.classList.toggle('idle', !isRunning);
      mascot.classList.toggle('run-bounce', isRunning);
      // 定位：以窗口中心为锚点（窗口本身由系统拖动，无需 JS 状态）
      mascot.style.transform = 'translate(-50%, -50%)';
    }

    window.electronAPI.onSetMode((newMode) => {
      mode = newMode === 'running' ? 'running' : 'idle';
      updateImage();
    });

    window.electronAPI.onSetSpeed(() => { /* 保留接口：速度由原地动画代替 */ });

    // ---- 拖动：通知主进程开始/结束，跟随移动由主进程轮询系统光标完成 ----
    // 渲染层不保存任何拖动状态；拖出窗口、事件丢失都不会导致残留或乱跑。
    const container = document.querySelector('.container');

    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // 仅左键拖动
      e.preventDefault();
      window.electronAPI.dragStart(e.screenX, e.screenY);
    });
    window.addEventListener('mouseup', () => window.electronAPI.dragEnd());
    // 兜底：窗口失焦（如弹出菜单）时也结束拖动
    window.addEventListener('blur', () => window.electronAPI.dragEnd());

    // ---- 右键：弹出迷你菜单（与设置面板同风格） ----
    container.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const x = window.screenX + e.clientX;
      const y = window.screenY + e.clientY;
      window.electronAPI.showContextMenu(x, y);
    });

    updateImage();
  </script>
</body>
</html>
